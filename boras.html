<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>borås-tillståndsrapport</title>
<style>
  html,body{margin:0;padding:0;background:#d9d9d9;color:#111;font-family:Arial,Helvetica,sans-serif}
  .topbar{position:sticky;top:0;z-index:50;background:#efeee6;border-bottom:1px solid #777;padding:8px 10px;font-size:14px}
  .topbar a{color:#000;text-decoration:underline;margin-right:18px}.topbar button{font:inherit;border:1px solid #777;background:#fff;padding:6px 10px;border-radius:0}
  .wrap{max-width:900px;margin:18px auto 40px;padding:0 10px}
  .page{position:relative;width:100%;aspect-ratio:1241/1754;background:white;margin:0 auto 22px;box-shadow:0 1px 8px rgba(0,0,0,.24);overflow:hidden}
  .template{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .field{position:absolute;box-sizing:border-box;border:1px solid transparent;background:rgba(255,255,255,.02);font-family:Arial,Helvetica,sans-serif;font-size:1.35vw;padding:.25%;outline:none;color:#111}
  .field:focus{border:1px dashed #555;background:rgba(255,255,210,.58)}
  textarea.field{resize:none}
  .check{position:absolute;width:1.45%;height:1.45%;margin:0;accent-color:#111}
  .imgslot{position:absolute;overflow:hidden;background:rgba(255,255,255,.01)}
  .imgslot img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
  .imgslot canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .addphoto{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #555;background:#f4f3ea;padding:7px 10px;font-size:12px;border-radius:0;z-index:4}
  .tools{position:absolute;left:0;bottom:0;z-index:6;background:rgba(244,243,234,.94);border-top:1px solid #777;border-right:1px solid #777;padding:3px;display:none}
  .tools button{border:1px solid #777;background:#fff;border-radius:0;margin:1px;padding:4px 6px;font-size:11px}
  .imgslot.has-image .tools{display:block}.imgslot.has-image .addphoto{display:none}
  .note{font-size:12px;max-width:900px;margin:0 auto 12px;padding:0 10px;color:#444}
  @media(max-width:700px){.wrap{padding:0 3px;margin-top:8px}.field{font-size:1.8vw}.topbar{font-size:13px}.tools button{padding:3px 5px;font-size:10px}}
  @media print{
    @page{size:A4 portrait;margin:0}
    html,body{background:white}
    .topbar,.note,.tools,.addphoto{display:none!important}
    .wrap{max-width:none;margin:0;padding:0}
    .page{width:210mm;height:297mm;aspect-ratio:auto;margin:0;box-shadow:none;page-break-after:always;overflow:hidden}
    .page:last-child{page-break-after:auto}
    .field{border:none!important;background:transparent!important}
  }
</style>
</head>
<body>
<div class="topbar"><a href="index.html">← reports</a><button onclick="window.print()">save / print pdf</button></div>
<div class="note">v1 test: tryck i fälten för att skriva. tryck på bildytor för foto. när foto finns: rita / nummer / ångra.</div>
<div class="wrap">

<!-- PAGE 1 -->
<section class="page" id="p1"><img class="template" src="page-1.png" alt="Borås template page 1">
  <input class="field" style="left:28.7%;top:15.35%;width:40.2%;height:2.45%" aria-label="Inv nr">
  <input class="field" style="left:28.7%;top:17.85%;width:40.2%;height:2.45%" aria-label="Utställningstitel">
  <input class="field" style="left:28.7%;top:20.35%;width:40.2%;height:2.45%" aria-label="Konstnär">
  <input class="field" style="left:28.7%;top:22.85%;width:40.2%;height:2.45%" aria-label="Titel">
  <input class="field" style="left:28.7%;top:25.35%;width:40.2%;height:2.45%" aria-label="Tillkomstår">
  <input class="field" style="left:28.7%;top:27.85%;width:40.2%;height:2.45%" aria-label="Material">
  <input class="field" style="left:28.7%;top:30.35%;width:40.2%;height:2.45%" aria-label="Ram">
  <input class="field" style="left:28.7%;top:32.85%;width:40.2%;height:2.45%" aria-label="Storlek">
  <input class="field" style="left:31.2%;top:40.2%;width:57.4%;height:3.15%" aria-label="Antal kollin">
  <input class="field" style="left:74.7%;top:47.0%;width:13.3%;height:2.7%" aria-label="Annat emballage">
  <input class="field" style="left:28.7%;top:67.1%;width:59.4%;height:2.6%" aria-label="Ankomstdatum">
  <input class="field" style="left:28.7%;top:70.15%;width:59.4%;height:2.6%" aria-label="Avsändningsdatum">

  <input type="checkbox" class="check" style="left:8.55%;top:43.62%"><input type="checkbox" class="check" style="left:37.06%;top:43.62%"><input type="checkbox" class="check" style="left:64.62%;top:43.62%">
  <input type="checkbox" class="check" style="left:8.55%;top:46.27%"><input type="checkbox" class="check" style="left:37.06%;top:46.27%">
  <input type="checkbox" class="check" style="left:8.55%;top:49.30%"><input type="checkbox" class="check" style="left:37.06%;top:49.30%"><input type="checkbox" class="check" style="left:64.62%;top:49.30%">
  <input type="checkbox" class="check" style="left:8.55%;top:52.25%"><input type="checkbox" class="check" style="left:37.06%;top:52.25%">
  <input type="checkbox" class="check" style="left:29.3%;top:58.15%"><input type="checkbox" class="check" style="left:59.85%;top:58.15%">
  <input type="checkbox" class="check" style="left:29.3%;top:63.12%"><input type="checkbox" class="check" style="left:59.85%;top:63.12%">

  <div class="imgslot" data-slot="p1img" style="left:69.1%;top:15.35%;width:21.6%;height:19.9%">
    <button class="addphoto" type="button">+ bild</button><img class="photo" alt=""><canvas></canvas>
    <div class="tools"><button type="button" data-tool="draw">rita</button><button type="button" data-tool="number">nummer</button><button type="button" data-tool="undo">ångra</button><button type="button" data-tool="replace">byt bild</button></div>
    <input type="file" accept="image/*" hidden>
  </div>
</section>

<!-- PAGE 2 -->
<section class="page" id="p2"><img class="template" src="page-2.png" alt="Borås template page 2">
  <textarea class="field" style="left:10.1%;top:11.5%;width:40%;height:18%" aria-label="Kommentar ankomst"></textarea>
  <input class="field" style="left:55.0%;top:11.5%;width:33%;height:5%" aria-label="Signatur ankomst">
  <textarea class="field" style="left:10.1%;top:23.2%;width:40%;height:18%" aria-label="Kommentar avsändning"></textarea>
  <input class="field" style="left:55.0%;top:23.2%;width:33%;height:5%" aria-label="Signatur avsändning">
</section>

<!-- PAGE 3 -->
<section class="page" id="p3"><img class="template" src="page-3.png" alt="Borås template recto">
  <div class="imgslot" data-slot="recto" style="left:9.7%;top:36.0%;width:80.8%;height:49.5%">
    <button class="addphoto" type="button">+ bild recto</button><img class="photo" alt=""><canvas></canvas>
    <div class="tools"><button type="button" data-tool="draw">rita</button><button type="button" data-tool="number">nummer</button><button type="button" data-tool="undo">ångra</button><button type="button" data-tool="replace">byt bild</button></div>
    <input type="file" accept="image/*" hidden>
  </div>
</section>

<!-- PAGE 4 -->
<section class="page" id="p4"><img class="template" src="page-4.png" alt="Borås template verso">
  <div class="imgslot" data-slot="verso" style="left:9.7%;top:36.0%;width:80.8%;height:49.5%">
    <button class="addphoto" type="button">+ bild verso</button><img class="photo" alt=""><canvas></canvas>
    <div class="tools"><button type="button" data-tool="draw">rita</button><button type="button" data-tool="number">nummer</button><button type="button" data-tool="undo">ångra</button><button type="button" data-tool="replace">byt bild</button></div>
    <input type="file" accept="image/*" hidden>
  </div>
</section>
</div>
<script>
(function(){
  var slots=document.querySelectorAll('.imgslot');
  for(var s=0;s<slots.length;s++) setupSlot(slots[s]);
  function setupSlot(slot){
    var input=slot.querySelector('input[type=file]'), add=slot.querySelector('.addphoto'), photo=slot.querySelector('.photo'), canvas=slot.querySelector('canvas'), ctx=canvas.getContext('2d');
    var mode='draw', drawing=false, last=null, number=1, history=[];
    function sizeCanvas(){var r=slot.getBoundingClientRect();var dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);redraw();}
    function snap(){history.push(canvas.toDataURL());if(history.length>20)history.shift();}
    function redrawFrom(url){var im=new Image();im.onload=function(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width/(window.devicePixelRatio||1),canvas.height/(window.devicePixelRatio||1));};im.src=url;}
    function redraw(){}
    function pos(e){var r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
    function start(e){if(!slot.classList.contains('has-image'))return;e.preventDefault();if(mode==='number'){snap();var p=pos(e);ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='white';ctx.fillStyle='black';ctx.strokeText(String(number),p.x,p.y);ctx.fillText(String(number),p.x,p.y);number++;return;}snap();drawing=true;last=pos(e);}
    function move(e){if(!drawing||mode!=='draw')return;e.preventDefault();var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='red';ctx.stroke();last=p;}
    function end(){drawing=false;last=null;}
    add.onclick=function(){input.click();};
    input.onchange=function(){var f=input.files&&input.files[0];if(!f)return;var reader=new FileReader();reader.onload=function(ev){photo.src=ev.target.result;slot.classList.add('has-image');setTimeout(sizeCanvas,50);};reader.readAsDataURL(f);};
    var bs=slot.querySelectorAll('.tools button');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){var t=this.getAttribute('data-tool');if(t==='replace'){input.click();return;}if(t==='undo'){if(history.length)redrawFrom(history.pop());return;}mode=t;};
    canvas.addEventListener('mousedown',start,false);canvas.addEventListener('mousemove',move,false);window.addEventListener('mouseup',end,false);
    canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end,false);
    window.addEventListener('resize',function(){if(slot.classList.contains('has-image'))setTimeout(sizeCanvas,100);});
  }
})();
</script>
</body></html>
