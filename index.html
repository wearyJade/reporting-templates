<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>choose your report</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f4f3ea;
      color: #111;
    }

    body {
      font-family: "Times New Roman", Times, serif;
      font-size: 18px;
    }

    .page {
      max-width: 760px;
      margin: 30px auto;
      padding: 34px 28px 38px 28px;
      border: 3px double #8b8b72;
      position: relative;
    }

    .corner-star {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 18px;
      color: #b98a9d;
      animation: blink 1.4s steps(2, start) infinite;
    }

    @keyframes blink {
      50% { opacity: 0.2; }
    }

    h1 {
      font-size: 42px;
      font-weight: normal;
      margin: 0 0 34px 0;
      letter-spacing: -1px;
      text-transform: lowercase;
    }

    .report-list {
      border-top: 1px solid #888;
    }

    .report {
      padding: 18px 4px;
      border-bottom: 1px dotted #888;
    }

   .report a {
  color: #3535a0;
  text-decoration: underline;
  font-size: 22px;
  cursor: pointer;
}

.report a:visited {
  color: #6b416f;
}

.report a:hover {
  color: #cc0000;
}

.report a:active {
  color: #ff0000;
}

    .gif-area {
      margin-top: 42px;
      text-align: right;
    }

    .gif-area img {
      width: 185px;
      max-width: 65%;
      height: auto;
      border: 3px ridge #bcb7a3;
    }

    .footer {
      margin-top: 30px;
      padding-top: 8px;
      border-top: 1px solid #888;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      color: #555;
      text-align: left;
    }

    #boras-report {
      display: none;
    }

    .back-link {
      color: #111;
      text-decoration: underline;
      cursor: pointer;
      font-size: 16px;
    }

    @media screen and (max-width: 600px) {
      .page {
        margin: 18px 12px;
        padding: 28px 18px 34px 18px;
      }

      h1 {
        font-size: 34px;
      }

      .report a {
        font-size: 21px;
      }

      .gif-area img {
        width: 160px;
      }
    }
  </style>
</head>

<body>

  <div class="page" id="home">

    <div class="corner-star">✦</div>

    <h1>choose your report</h1>

    <div class="report-list">

      <div class="report">
<a href="boras.html">borås-tillståndsrapport</a>
      </div>

      <div class="report">
        <a onclick="notReady()">condition-report</a>
      </div>

      <div class="report">
        <a onclick="notReady()">iteration-report</a>
      </div>

    </div>

    <div class="gif-area">
      <img
        src="https://i.makeagif.com/media/10-17-2022/gS4Ma2.gif"
        alt="Pipilotti Rist – Ever is Over All">
    </div>

    <div class="footer">
      © 2026 wearyJade / reporting-system
    </div>

  </div>


  <div class="page" id="boras-report">

    <a class="back-link" onclick="goHome()">← tillbaka</a>

    <h1 style="margin-top:35px;">borås-tillståndsrapport</h1>

    <div style="border-top:1px solid #777; margin-bottom:30px;"></div>

    <p>rapportformuläret bygger vi här.</p>

  </div>


  <script>
    function openBorasReport() {
      document.getElementById("home").style.display = "none";
      document.getElementById("boras-report").style.display = "block";
      window.scrollTo(0, 0);
    }

    function goHome() {
      document.getElementById("boras-report").style.display = "none";
      document.getElementById("home").style.display = "block";
      window.scrollTo(0, 0);
    }

    function notReady() {
      alert(" ");
    }
  </script>

</body>
</html>
