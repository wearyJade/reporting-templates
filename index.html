<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>choose your report</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f4f3ea;
      color: #111111;
    }

    body {
      font-family: "Times New Roman", Times, serif;
      font-size: 18px;
      line-height: 1.4;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 50px 28px 55px 28px;
    }

    .topline {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      border-bottom: 1px solid #777;
      padding-bottom: 6px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 38px;
      font-weight: normal;
      margin: 0 0 28px 0;
      letter-spacing: -1px;
      text-transform: lowercase;
    }

    .report-list {
      margin-top: 12px;
      border-top: 1px solid #777;
    }

    .report {
      padding: 16px 4px;
      border-bottom: 1px dotted #777;
    }

    .report a {
      color: #111111;
      text-decoration: none;
      font-size: 22px;
      cursor: pointer;
    }

    .report a:hover {
      text-decoration: underline;
      color: #0000aa;
    }

    .report a:active {
      color: #cc0000;
    }

    .gif-area {
      margin-top: 48px;
      text-align: left;
    }

    .gif-area img {
      width: 220px;
      max-width: 70%;
      height: auto;
      border: 1px solid #777;
    }

    .gif-caption {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      color: #555;
      margin-top: 4px;
    }

    .footer {
      margin-top: 35px;
      padding-top: 8px;
      border-top: 1px solid #777;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      color: #555555;
    }

    #boras-report {
      display: none;
    }

    .back-link {
      color: #111111;
      text-decoration: underline;
      cursor: pointer;
      font-size: 16px;
    }

    @media screen and (max-width: 600px) {
      .page {
        padding: 32px 20px 45px 20px;
      }

      h1 {
        font-size: 32px;
      }

      .report a {
        font-size: 21px;
      }

      .gif-area img {
        width: 180px;
      }
    }
  </style>
</head>

<body>

  <!-- STARTSIDA -->

  <div class="page" id="home">

    <div class="topline">
      report selection system / v.1
    </div>

    <h1>choose your report</h1>

    <div class="report-list">

      <div class="report">
        <a onclick="openBorasReport()">borås-tillståndsrapport</a>
      </div>

      <div class="report">
        <a onclick="notReady()">condition-report</a>
      </div>

      <div class="report">
        <a onclick="notReady()">iteration-report</a>
      </div>

    </div>

    <div class="gif-area">
      <img
        src="https://i.makeagif.com/media/10-17-2022/gS4Ma2.gif"
        alt="Pipilotti Rist – Ever is Over All">
      <div class="gif-caption">
        pipilotti rist / ever is over all
      </div>
    </div>

    <div class="footer">
      © 2026 reporting system
    </div>

  </div>


  <!-- BORÅS-RAPPORT -->

  <div class="page" id="boras-report">

    <a class="back-link" onclick="goHome()">← tillbaka</a>

    <h1 style="margin-top:35px;">borås-tillståndsrapport</h1>

    <div style="border-top:1px solid #777; margin-bottom:30px;"></div>

    <p>
      rapportformuläret bygger vi här.
    </p>

  </div>


  <script>

    function openBorasReport() {
      document.getElementById("home").style.display = "none";
      document.getElementById("boras-report").style.display = "block";
      window.scrollTo(0, 0);
    }

    function goHome() {
      document.getElementById("boras-report").style.display = "none";
      document.getElementById("home").style.display = "block";
      window.scrollTo(0, 0);
    }

    function notReady() {
      alert(" ");
    }

  </script>

</body>
</html>
